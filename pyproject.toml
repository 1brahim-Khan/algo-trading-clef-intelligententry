[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-clef-intelligententry"
version = "0.1.0"
description = "Local, paper-only chart trading with Cloudflare Clef"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0,<13"]

[project.scripts]
clef-trader = "clef_trader.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["clef_trader*"]
